<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <title>Reset hasła</title>
  </head>
  <body>
    <h1>Resetowanie hasła</h1>

    {% if message %}
      <p>{{ message }}</p>
    {% endif %}

    <form method="post" action="/forgot-password">
      <label>Email</label>
      <input type="email" name="email" required>
      <button type="submit">Wyślij link resetujący</button>
    </form>

    {% if token %}
      <p><strong>Token (dev):</strong> {{ token }}</p>
      <p>Link resetu:
        <a href="/reset-password?token={{ token }}">
          /reset-password?token={{ token }}
        </a>
      </p>
    {% endif %}
  </body>
</html>
